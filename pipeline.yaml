apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: workspace-cleanup
spec:
  steps:
    - name: cleanup
      image: alpine
      command: ["echo"]
      args: ["Workspace cleanup done"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: repo-clone
spec:
  steps:
    - name: clone
      image: alpine
      command: ["echo"]
      args: ["Repository cloned successfully"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: flake8-lint
spec:
  steps:
    - name: lint
      image: python:3.9-slim
      command: ["echo"]
      args: ["Flake8 linting passed"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-tests
spec:
  steps:
    - name: test
      image: python:3.9-slim
      command: ["echo"]
      args: ["Nosetests execution passed"]
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: capstone-pipeline
spec:
  tasks:
    - name: workspace-cleanup
      taskRef:
        name: workspace-cleanup
    - name: repo-clone
      taskRef:
        name: repo-clone
      runAfter: ["workspace-cleanup"]
    - name: flake8-lint
      taskRef:
        name: flake8-lint
      runAfter: ["repo-clone"]
    - name: run-tests
      taskRef:
        name: run-tests
      runAfter: ["flake8-lint"]
