apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-task
spec:
  steps:
    - name: build
      image: python:3.9-slim
      command: ["echo"]
      args: ["Building capstone..."]
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: capstone-pipeline
spec:
  tasks:
    - name: build
      taskRef:
        name: build-task
